spring.application.name=studentsync-backend

# Port: Render sets PORT automatically. On your laptop it stays 8081.
server.port=${PORT:8081}

# ---------- MySQL ----------
# On your laptop the values after the ':' are used (local MySQL, user root, password root).
# Online (Render), the DB_URL / DB_USERNAME / DB_PASSWORD environment variables replace them.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studentsync?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Keep the connection pool small for the free online database
spring.datasource.hikari.maximum-pool-size=5

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Websites allowed to call this API: the local React dev server and any Vercel deployment
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://*.vercel.app}
