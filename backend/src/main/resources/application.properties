spring.application.name=studentsync-backend
server.port=8081

# ---------- MySQL ----------
# Create nothing by hand: the database is created on first run.
# Change the username/password to match your MySQL installation.
spring.datasource.url=jdbc:mysql://localhost:3306/studentsync?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# React dev server allowed to call this API
app.cors.allowed-origin=http://localhost:5173
